name: PKGViz Audit

on:
  workflow_call:
    inputs:
      pkgviz_version:
        description: PKGViz npm version to execute. Pin this in CI for reproducibility.
        required: false
        type: string
        default: latest
      cyclic_dependencies:
        description: 'Policy for cyclic-dependencies: off, audit, or block.'
        required: false
        type: string
        default: block
      fail_on_rule_violation:
        description: Fail the job when a blocking audit rule is violated.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      pkgviz_version:
        description: PKGViz npm version to execute.
        required: false
        type: string
        default: latest
      cyclic_dependencies:
        description: Policy for cyclic-dependencies.
        required: true
        type: choice
        options:
          - off
          - audit
          - block
        default: audit
      fail_on_rule_violation:
        description: Fail the job when a blocking audit rule is violated.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run PKGViz audit
        env:
          PKGVIZ_VERSION: ${{ inputs.pkgviz_version }}
          PKGVIZ_CYCLIC_DEPENDENCIES: ${{ inputs.cyclic_dependencies }}
          PKGVIZ_FAIL_ON_RULE_VIOLATION: ${{ inputs.fail_on_rule_violation }}
        run: |
          set -euo pipefail

          case "${PKGVIZ_CYCLIC_DEPENDENCIES}" in
            off|audit|block) ;;
            *)
              echo "Invalid cyclic_dependencies mode: ${PKGVIZ_CYCLIC_DEPENDENCIES}" >&2
              exit 1
              ;;
          esac

          args=(
            --out pkgviz-audit.json
            --rule "cyclic-dependencies=${PKGVIZ_CYCLIC_DEPENDENCIES}"
          )

          if [ "${PKGVIZ_FAIL_ON_RULE_VIOLATION}" != "true" ]; then
            args+=(--no-fail-on-rule-violation)
          fi

          npx --yes "pkgviz@${PKGVIZ_VERSION}" "${args[@]}"

      - name: Upload PKGViz audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkgviz-audit
          path: pkgviz-audit.json
          if-no-files-found: warn
