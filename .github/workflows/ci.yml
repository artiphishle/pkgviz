name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  install-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: 📥 Install dependencies (scripts disabled)
        env:
          # Protect vs SHA1-Hulud attack
          BUN_INSTALL_POSTINSTALL: '0'
          BUN_INSTALL_PREINSTALL: '0'
        run: bun install --no-save # noch weniger Angriffsfläche

      - name: 🧹 Lint
        run: bun run lint

      - name: 🎨 Format check
        run: |
          bunx prettier --write .agents/skills/hexagonal-architecture/SKILL.md
          git diff -- .agents/skills/hexagonal-architecture/SKILL.md
          git diff --exit-code

      - name: ✅ Test
        run: bun run test

      - name: 🏗️ Build
        env:
          NEXT_PUBLIC_PROJECT_PATH: ${{ github.workspace }}
        run: bun run build
