name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  install-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: 📥 Install dependencies (scripts disabled)
        env:
          # Protect vs SHA1-Hulud attack
          BUN_INSTALL_POSTINSTALL: '0'
          BUN_INSTALL_PREINSTALL: '0'
        run: bun install --no-save # noch weniger Angriffsfläche

      - name: 🧭 Bootstrap Devtools tooling
        run: |
          bun add -D @ankhorage/devtools
          bunx @ankhorage/ankh devtools package sync .
          bunx @ankhorage/ankh devtools skills sync .
          bunx @ankhorage/ankh devtools eslint sync .
          bunx @ankhorage/ankh devtools prettier sync .
          bunx @ankhorage/ankh devtools knip sync .
          bunx @ankhorage/ankh devtools vscode sync .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Devtools repository tooling [skip ci]"
            git push origin HEAD:chore/add-agents-instructions
          fi

      - name: 🧹 Lint
        run: bun run lint

      - name: 🎨 Format check
        run: bun run format:check

      - name: ✅ Test
        run: bun run test

      - name: 🏗️ Build
        env:
          NEXT_PUBLIC_PROJECT_PATH: ${{ github.workspace }}
        run: bun run build
