name: Format local ESLint debt

on:
  push:
    branches:
      - chore/add-agents-instructions

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/add-agents-instructions

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - run: bun install --frozen-lockfile

      - name: Format local ESLint config
        run: bunx prettier --write eslint.local.config.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet -- eslint.local.config.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eslint.local.config.mjs
          git commit -m "style: format local ESLint migration debt [skip ci]"
          git push origin HEAD:chore/add-agents-instructions
